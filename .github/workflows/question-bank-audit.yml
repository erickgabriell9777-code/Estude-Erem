name: Question bank audit

on:
  workflow_dispatch:
  push:
    branches: [main, feat/question-bank-expansion-batch-1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Validate study content and release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit question bank
        run: pnpm audit:questions
      - name: Validate study session behavior
        run: pnpm run test:study
      - name: Validate version and changelog
        run: pnpm run version:check
